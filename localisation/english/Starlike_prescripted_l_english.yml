 EMPIRE_DESIGN_The_Glory_Of_Selene:0 "The Glory Of Selene"
 EMPIRE_DESIGN_The_Glory_Of_Selene_desc:0 "Millions of years ago, the first hominids were born on a distant blue planet called Earth. Since then, our civilization has gradually prospered in its development and spread.\nIn the chaotic early days of human history, many empires fought for power and cheated, but in the face of a planetary scale geological disaster, we had to put aside our prejudices about each other and work together to flee our homes. During the long space station exile, our civilization and race changed dramatically. We, one of the five forces of the space station era, known as The Glory Of Selene's, have finally found a habitable planet after a long Odyssey. Since then, The Glory Of Selene's future has once again become brighter.\nShortly after the success of the umbrella society, a sudden and powerful subspace storm swept through the Galaxy, cutting us off from the rest of the galaxy. After years of mapping hyperspace routes and improving FTL engines, today the best minds in The Glory Of Selene have completed the construction of a new batch of FTL ships. Today, we once again take steps towards the sea of stars!  "

 EMPIRE_DESIGN_Commonwealth_Of_Pan-Galaxy_Unified:0 "Commonwealth Of Pan-Galaxy Unified"
 EMPIRE_DESIGN_Commonwealth_Of_Pan-Galaxy_Unified_desc:0 "Millions of years ago, the first hominids were born on a distant blue planet called Earth. Since then, our civilization has gradually prospered in its development and spread.\nIn the chaotic early days of human history, many empires fought for power and cheated, but in the face of a planetary scale geological disaster, we had to put aside our prejudices about each other and work together to flee our homes. During the long space station exile, our civilization and race changed dramatically. It has been a long time since we left our blue home, but we are not willing to put down and forget our place of origin during the long interstellar voyage. After much tossing and turning, the Phoenix's Feather finally found a habitable planet and settled there. Full of the spirit of the orthodox continuation of human civilization, we are calling upon the scattered humans to come back one day to save our home planet.\nShortly after the success of the Umbrella Shape Society, a sudden and powerful subspace storm swept through the Galaxy, cutting us off from the rest of the galaxy. After years of mapping hyperspace routes and improving FTL engines, today, the best minds in Commonwealth Of Pan-Galaxy Unified have completed the construction of a new batch of FTL ships. Today, we once again take steps towards the sea of stars!  "