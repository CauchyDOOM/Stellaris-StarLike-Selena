 EMPIRE_DESIGN_The_Glory_Of_Selene:0 "赛琳娜之耀"
 EMPIRE_DESIGN_The_Glory_Of_Selene_desc:0 "亿万年前，最初的原始人类在远方一颗名为地球的蔚蓝色星球上诞生。从那时起，我们的文明便在发展与传播中逐渐走向繁荣。\n在人类历史早期的混乱时代中，许多帝国争权夺利，尔虞我诈，然而在一场恒星系级的地质灾害面前，我们不得不放下对彼此的成见，同心协力逃离我们的家园。在这漫长空间站时代的流亡之路中，我们的文明与种族也发生了巨大的变化。而作为空间站时代五大势力中的一支，被称为赛琳娜之耀的我们，终于在漫长的星海流亡后找到了一颗适合居住的星球。从此，赛琳娜之耀的前景再一次变得光明起来。\n伞形社会成功建立后不久，一场突如其来的超强亚空间风暴席卷了银河，切断了我们与银河其他部分的交通与联络。经过多年的超空间航道测绘与超光速引擎的改良，今天，赛琳娜之耀中最优秀的头脑们完成了新一批超光速飞船的建造。今天，我们再次向星辰大海迈出了步伐！"

 EMPIRE_DESIGN_Commonwealth_Of_Pan-Galaxy_Unified:0 "一体汉和"
 EMPIRE_DESIGN_Commonwealth_Of_Pan-Galaxy_Unified_desc:0 "亿万年前，最初的原始人类在远方一颗名为地球的蔚蓝色星球上诞生。从那时起，我们的文明便在发展与传播中逐渐走向繁荣。\n在人类历史早期的混乱时代中，许多帝国争权夺利，尔虞我诈，然而在一场恒星系级的地质灾害面前，我们不得不放下对彼此的成见，同心协力逃离我们的家园。在这漫长空间站时代的流亡之路中，我们的文明与种族也发生了巨大的变化。距我们离开蔚蓝色家园的已经过去很远，然而在漫长的星际航行中我们却并不愿放下并遗忘我们的起源之地。几经辗转，鸾羽号终于找到了一颗宜居星球并且在此定居。充满着人类文明正统延续精神的我们，正在向散落星海中其他的零星人类发出召唤，有朝一日能回来拯救我们的母星。\n伞形社会成功建立后不久，一场突如其来的超强亚空间风暴席卷了银河，切断了我们与银河其他部分的交通与联络。经过多年的超空间航道测绘与超光速引擎的改良，今天，一体汉和中最优秀的头脑们完成了新一批超光速飞船的建造。今天，我们再次向星辰大海迈出了步伐！"